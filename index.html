<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141311" />
    <title>MSK Aesthetics · HT Operations</title>
    <link rel="icon" type="image/png" href="/msk-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <!-- Sign in -->
    <main class="login" id="loginScreen" hidden>
      <div class="login-panel">
        <div class="login-brand">
          <img src="/msk-logo.png" alt="" width="44" height="44" />
          <div>
            <span class="login-wordmark">MSK Aesthetics</span>
            <span class="login-product">HT Operations</span>
          </div>
        </div>
        <h1>Sign in</h1>
        <p class="login-lead">Operating floor, roster and procedure records for today's session.</p>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="logEmail">Email</label>
            <input type="email" id="logEmail" autocomplete="username" inputmode="email" required />
          </div>
          <div class="field">
            <label for="logPass">Password</label>
            <div class="password-field">
              <input type="password" id="logPass" autocomplete="current-password" required />
              <button type="button" class="icon-btn" id="togglePass" aria-label="Show password" aria-pressed="false">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <label class="check-inline"><input type="checkbox" id="rememberMe" /> Remember my email</label>
          <button type="submit" class="btn primary block lg" id="loginBtn">Sign in</button>
          <p class="login-err" id="logErr" role="alert" aria-live="assertive"></p>
        </form>
        <p class="login-foot">Accounts are created by your administrator.</p>
      </div>
      <aside class="login-art" aria-hidden="true">
        <div class="login-art-inner">
          <span class="login-art-k">Hair Transplant Operations</span>
          <p>Every OT room, every phase, every graft — in one view.</p>
        </div>
      </aside>
    </main>

    <!-- App -->
    <div class="app" id="mainApp">
      <div class="sidebar-scrim" id="sidebarScrim"></div>
      <aside class="sidebar" aria-label="Primary">
        <div class="sb-brand">
          <img src="/msk-logo.png" alt="" width="32" height="32" />
          <div class="sb-brand-text"><strong>MSK Aesthetics</strong><span>HT Operations</span></div>
        </div>
        <nav class="nav" id="nav" aria-label="Main navigation"></nav>
        <div class="sb-foot">
          <span class="sb-clock" id="sidebarClock" aria-hidden="true"></span>
          <button type="button" class="nav-item" id="collapseBtn" title="Collapse sidebar"><span data-ico="collapse"></span><span class="nav-label">Collapse</span></button>
          <button type="button" class="nav-item" id="logoutBtn" title="Sign out"><span data-ico="logout"></span><span class="nav-label">Sign out</span></button>
        </div>
      </aside>

      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menuToggle" aria-label="Open navigation" aria-expanded="false"><span data-ico="menu"></span></button>
        <div class="topbar-main" id="topbarMain"></div>
      </header>

      <main class="main" id="view" tabindex="-1"></main>
    </div>

    <div class="toast-host" id="toastHost" aria-live="polite"></div>
    <div class="dialog-host" id="dialogHost" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
